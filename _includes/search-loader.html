<!--
  Client search for Chirpy’s panel (top-right).
  Custom engine: debouncing + relevance ranking (exact title before body substring hits).
  See assets/js/blog-search.js. Theme still loads Simple-Jekyll-Search from CDN but it is unused.
-->
{% capture not_found %}<p class="mt-5">{{ site.data.locales[include.lang].search.no_results }}</p>{% endcapture %}

<script src="{{ '/assets/js/blog-search.js' | relative_url }}" defer></script>
<script defer>
  document.addEventListener('DOMContentLoaded', function () {
    var input = document.getElementById('search-input');
    var results = document.getElementById('search-results');
    if (!input || !results || typeof BlogSearch === 'undefined') return;
    BlogSearch.init({
      input: input,
      results: results,
      jsonUrl: {{ '/assets/js/data/search.json' | relative_url | jsonify }},
      noResultsHtml: {{ not_found | strip_newlines | jsonify }},
      debounceMs: 280,
      maxResults: 40,
      contentPreviewLen: 220
    });
  });
</script>
