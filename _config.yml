# Site (see https://jekyllrb.com/docs/themes/#overriding-theme-defaults)
theme: jekyll-theme-chirpy

lang: en
timezone: Asia/Shanghai

title: Gerry's blog
tagline: 他山之石，可以攻玉
description: >-
  他山之石，可以攻玉

url: "http://gerryyang.com"
baseurl: ""

github:
  username: gerryyang2025

twitter:
  username: ""

social:
  name: gerryyang
  email: ""
  links:
    - https://github.com/gerryyang2025
    - https://blog.csdn.net/delphiwcdj

webmaster_verifications:
  google: ""
  bing: ""
  baidu: ""

analytics:
  google: "UA-NNNNNNNN-N"
  goatcounter: {}
  umami: {}
  matomo: {}
  cloudflare: {}
  fathom: {}

pageviews:
  provider: ""

theme_mode: ""

cdn: ""

avatar: ""

social_preview_image: ""

toc: true

comments:
  # Keep empty (null) to disable comments globally.
  provider:
  disqus:
    shortname:
  utterances:
    repo:
  giscus:

assets:
  self_host: { enabled: false, env: "" }

pwa:
  enabled: false
  cache: { enabled: false, deny_paths: [] }

paginate: 10

# Build
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-archives

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
  span: { line_numbers: false }
  block: { line_numbers: true, start_line: 1 }

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

# Local serving (optional)
detach: true
port: 8080
host: 172.19.0.16
show_dir_listing: false
