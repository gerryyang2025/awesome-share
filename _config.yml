# Site (see https://jekyllrb.com/docs/themes/#overriding-theme-defaults)
theme: jekyll-theme-chirpy

lang: en
timezone: Asia/Shanghai

title: Gerry's blog
tagline: 他山之石，可以攻玉
description: >-
  他山之石，可以攻玉

# Use https if your site is served over HTTPS.
url: "http://gerryyang.com"
baseurl: ""
# Base URL for share/copy links (use production domain so shares are correct when serving locally)
share_base_url: "http://gerryyang.com"

github:
  username: gerryyang2025

twitter:
  username: ""

social:
  name: gerryyang
  email: ""
  links:
    - https://github.com/gerryyang2025
    - https://blog.csdn.net/delphiwcdj

webmaster_verifications:
  google: ""
  bing: ""
  baidu: ""

# Chirpy expects each platform to have an `id` key when enabled.
analytics:
  google:
    id: "" # e.g. UA-NNNNNNNN-N or G-XXXXXXXXXX
  goatcounter: {}
  umami: {}
  matomo: {}
  cloudflare: {}
  fathom: {}

pageviews:
  provider: ""

theme_mode: ""

cdn: ""

avatar: ""

social_preview_image: ""

# 首页「爱英语学习 - 墨小灵」虚拟形象与 AI 单词助手入口（见 _includes/moxiaoling-hero.html）
moxiaoling:
  enabled: true
  heading: "爱英语学习 - 墨小灵"
  subheading: "嗨，小朋友你好！我是墨小灵，可以陪你问单词、一起学英语。"
  assistant_url: "http://english.gerryyang.com/"
  assistant_label: "打开 AI 单词助手"
  panel_label: "在这里问小灵"
  parent_note: "请家长陪同使用；不要告诉小灵你的真实姓名、学校和家庭住址哦。"
  quick_prompts:
    - label: "我想学个新单词"
    - label: "用英语打个招呼吧"
    - label: "来玩单词小游戏"

toc: true

comments:
  # Keep empty (null) to disable comments globally.
  provider:
  disqus:
    shortname:
  utterances:
    repo:
  giscus:

assets:
  self_host: { enabled: false, env: "" }

pwa:
  enabled: false
  cache: { enabled: false, deny_paths: [] }

paginate: 10

# Build
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-archives

kramdown:
  input: GFM
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
  span: { line_numbers: false }
  block: { line_numbers: true, start_line: 1 }

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: true
  ignore:
    # Disable compression so code blocks keep newlines (compress was collapsing <pre> content)
    envs: [development, production]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

# Local serving (optional)
detach: true
port: 8080
host: 172.19.0.16
show_dir_listing: false
